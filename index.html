}

.modal-content{

padding:15px;

.overdue{
color:#d32f2f;

}

.progress{
height:8px;
background:#e0e0e0;

<body>

<h1>🍅 とまログ</h1>



<div class="card" id="weatherCard">
  ☁️ 天気取得中...
</div>
  
<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<!-- モーダル -->
<div class="modal" id="modal">
<div class="modal-content">

<h3 id="modalTitle"></h3>

<input type="date" id="eventDate">

<div id="extraFields"></div>

<button onclick="saveEvent()">保存</button>
<button onclick="closeModal()">キャンセル</button>

</div>
</div>

<script>

/* ===== データ ===== */
let plants = JSON.parse(localStorage.getItem("tomalog") || "[]");
let notified = JSON.parse(localStorage.getItem("tomalog_notified") || "{}");

let modalState = { plantId:null, type:null };

let openPlants = JSON.parse(
  localStorage.getItem("tomalog_open") || "{}"
);
  
/* ===== 通知許可 ===== */
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

/* ===== 保存 ===== */
function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

/* ===== 開閉状態保存 ===== */
function saveOpenState(){
  localStorage.setItem(
    "tomalog_open",
    JSON.stringify(openPlants)
  );
}

function togglePlant(id){
  openPlants[id] = !openPlants[id];
  saveOpenState();
  render();
}

/* ===== 日数 ===== */
function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* ===== 収穫目安 ===== */

function getHarvestDays(name){

  if(name.includes("トマト") || name.includes("とまと"))

    return 80;

  if(name.includes("オクラ"))

    return 60;

  if(name.includes("枝豆"))

    return 75;

  if(name.includes("大葉"))

    return 45;

  if(name.includes("きゅうり"))

    return 55;

  if(name.includes("二十日大根"))

    return 30;

  if(name.includes("モロヘイヤ"))

  return 60;

  return null;

}

  function getFlowerHarvestDays(name){

  if(name.includes("トマト") || name.includes("とまと")) return 45;

  if(name.includes("きゅうり")) return 8;

  if(name.includes("オクラ")) return 5;

  if(name.includes("枝豆")) return 35;

  return null;

}

/* ===== 追加 ===== */
function addPlant(){

const name=document.getElementById("name").value;
const date=document.getElementById("date").value;

if(!name||!date){
alert("入力してください");
return;
}

  plants.push({
id:crypto.randomUUID(),
name,
sow:date,
finished:false,
finishedDate:null,
events:[{
id:crypto.randomUUID(),
date,
text:"種まき"
}]
});

save();

document.getElementById("name").value = "";
document.getElementById("date").value = "";

}

/* ===== モーダル ===== */
function openModal(plantId,type){

modalState={plantId,type};

document.getElementById("modal").style.display="flex";

const titleMap={
germ:"🌱 発芽",
flower:"🌸 開花",
fert:"💧 液肥",
pest:"🐛 害虫",
rohaphi:"💊 ロハピ",
harvest:"🍅 収穫",
memo:"📝 メモ"
};

document.getElementById("modalTitle").innerText=titleMap[type];

document.getElementById("eventDate").value=new Date().toISOString().slice(0,10);

const extra=document.getElementById("extraFields");
extra.innerHTML="";

if(type==="fert"){

const fertTypes = [
  ...new Set(
    plants
      .flatMap(p => p.events)
      .filter(e => e.text.startsWith("💧"))
      .map(e => {
        const match = e.text.match(/^💧 (.+?)（/);
        return match ? match[1] : "";
      })
      .filter(Boolean)
  )
];

const fertRatios = [
  ...new Set(
    plants
      .flatMap(p => p.events)
      .filter(e => e.text.startsWith("💧"))
      .map(e => {
        const match = e.text.match(/（(.+?)）/);
        return match ? match[1] : "";
      })
      .filter(Boolean)
  )
];

extra.innerHTML=`
<input id="fertType"
placeholder="液肥の種類"
list="fertTypeList">

<datalist id="fertTypeList">
${fertTypes.map(x => `<option value="${x}">`).join("")}
</datalist>

<input id="fertRatio"
placeholder="希釈（例：1000倍）"
list="fertRatioList">

<datalist id="fertRatioList">
${fertRatios.map(x => `<option value="${x}">`).join("")}
</datalist>
`;
}

if(type==="pest"){
extra.innerHTML=`
<input id="pestType" placeholder="害虫名">
<input id="pestLevel" placeholder="量（少ない・普通・多い）">
`;
}

if(type==="memo"){
extra.innerHTML=`
<input id="memoText" placeholder="メモ">
`;
}
if(type==="harvest"){
extra.innerHTML=`
<input id="harvestCount"
type="number"
min="1"
placeholder="収穫数（個）">
`;
}
}

/* ===== 閉じる ===== */
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* ===== 保存 ===== */
function saveEvent(){

const plant = plants.find(p => p.id === modalState.plantId);
const date = document.getElementById("eventDate").value;

if(!date) return;

let text="";

switch(modalState.type){

case "germ":
text="🌱 発芽";
break;

    case "flower":
text="🌸 開花";
break;

case "fert":
text=`💧 ${document.getElementById("fertType").value}（${document.getElementById("fertRatio").value}）`;
break;

case "pest":
text=`🐛 ${document.getElementById("pestType").value}（${document.getElementById("pestLevel").value}）`;
break;

case "rohaphi":
text="💊 ロハピ";
break;

case "harvest":

const count =
document.getElementById("harvestCount").value || 0;

text=`🍅 収穫 ${count}個`;

break;

case "memo":
text=`📝 ${document.getElementById("memoText").value}`;
break;

}

plant.events.push({
id:crypto.randomUUID(),
date,
text
});

save();
closeModal();
}

/* ===== 削除 ===== */
function deletePlant(id){
if(!confirm("削除しますか？"))return;
plants=plants.filter(p=>p.id!==id);
save();
}

/* ===== 栽培終了 ===== */
function finishPlant(id){

  if(!confirm("栽培を終了しますか？\n一覧からは消えますが、栽培アルバムで見返せます。")) return;

  const plant = plants.find(p => p.id === id);

  plant.finished = true;
  plant.finishedDate = new Date().toISOString().slice(0,10);

  save();
}

function deleteEvent(pid,eid){
const plant=plants.find(p=>p.id===pid);
plant.events=plant.events.filter(e=>e.id!==eid);
save();
}

/* ===== 通知（液肥7日） ===== */
function checkNotifications(){

  if(Notification.permission !== "granted") return;

  plants
  .slice()
  .sort((a,b)=>new Date(a.sow)-new Date(b.sow))
  .forEach(plant=>{

    plant.events.forEach(e=>{

      if(!e.text.startsWith("💧")) return;

      const diff = days(e.date);

      if(diff === 7 && !notified[e.id]){

        new Notification("🌱 とまログ", {
          body:`${plant.name}：液肥から7日経ちました`
        });

        notified[e.id] = true;
        localStorage.setItem(
          "tomalog_notified",
          JSON.stringify(notified)
        );

      }

    });

  });

}

onclick="togglePlant('${plant.id}')"

💧${fert ? fertDays : "-"}日

</div>

<div class="progress">
<div
class="progress-bar"
style="width:${progress}%">
</div>

</div>

${isOpen ? `
<div class="small">${germText}</div>
<div class="small">${fertText}</div>
<div class="small">${forecastText}</div>

<div class="quick-buttons">
${!germ ? `
<button onclick="event.stopPropagation();openModal('${plant.id}','germ')">
🌱 発芽
</button>
` : ""}
${germ ? `
<button onclick="event.stopPropagation();openModal('${plant.id}','flower')">
🌸 開花
</button>
` : ""}
<button onclick="event.stopPropagation();openModal('${plant.id}','fert')">💧 液肥</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','pest')">🐛 害虫</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','harvest')">🍅 収穫</button>

</div>

${!plant.finished ? `
<button onclick="event.stopPropagation();finishPlant('${plant.id}')">
🏁 栽培終了
</button>
` : ""}

<button onclick="event.stopPropagation();deletePlant('${plant.id}')">
この野菜を削除
</button>

<ul>${events}</ul>
` : ""}
`;

list.appendChild(div);

});

  list.innerHTML += "<h2>📦 栽培アルバム</h2>";

archivePlants.forEach(plant => {

  const totalDays = Math.floor(
    (new Date(plant.finishedDate) - new Date(plant.sow))
    / 86400000
  );

  const totalHarvest = plant.events
    .filter(e => e.text.startsWith("🍅 収穫"))
    .reduce((sum, e) => {
      const match = e.text.match(/(\d+)個/);
      return sum + (match ? Number(match[1]) : 0);
    }, 0);

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <b>📦 ${plant.name}</b><br>
    🌱 栽培日数：${totalDays}日<br>
    🍅 収穫数：${totalHarvest}個
  `;

  list.appendChild(div);

});

checkNotifications();

}

setInterval(checkNotifications, 60 * 60 * 1000);

    else if(
      [95,96,99].includes(code)
    ) weather = "⛈️";

    document.getElementById("weatherCard").innerHTML =
`
<div style="font-size:20px">
${weather} 長野市 ${temp}℃
</div>

<div class="small">
${advice}
</div>
`;

  }catch(e){

    document.getElementById(
      "weatherCard"
    ).innerHTML =
      "⚠️ 天気取得失敗";

  }
}
  
loadWeather();
render();

</script>

</body>
</html>
