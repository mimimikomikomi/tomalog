<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}

.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.4);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-content{
background:white;
padding:15px;
border-radius:10px;
width:100%;
max-width:320px;
}

.overdue{
color:#d32f2f;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<div class="modal" id="modal">
<div class="modal-content">

<h3 id="modalTitle"></h3>

<input type="date" id="eventDate">

<div id="extraFields"></div>

<button onclick="saveEvent()">保存</button>
<button onclick="closeModal()">キャンセル</button>

</div>
</div>

<script>

let plants = JSON.parse(localStorage.getItem("tomalog") || "[]");
let notified = JSON.parse(localStorage.getItem("tomalog_notified") || "{}");

let modalState = {
plantId:null,
type:null
};

if ("Notification" in window && Notification.permission !== "granted") {
Notification.requestPermission();
}

function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

function days(date){
return Math.floor(
(Date.now() - new Date(date)) / 86400000
);
}

function addPlant(){

const name=document.getElementById("name").value;
const date=document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id:crypto.randomUUID(),
name,
sow:date,
events:[
{
id:crypto.randomUUID(),
date,
text:"種まき"
}
]
});

save();

document.getElementById("name").value="";
document.getElementById("date").value="";
}

function openModal(plantId,type){

modalState={plantId,type};

document.getElementById("modal").style.display="flex";

const titleMap={
germ:"🌱 発芽",
fert:"💧 液肥",
pest:"🐛 害虫",
rohaphi:"💊 ロハピ",
harvest:"🍅 収穫",
memo:"📝 メモ"
};

document.getElementById("modalTitle").innerText=titleMap[type];
document.getElementById("eventDate").value=
new Date().toISOString().slice(0,10);

const extra=document.getElementById("extraFields");
extra.innerHTML="";

if(type==="fert"){
extra.innerHTML=`
<input id="fertType" placeholder="液肥の種類">
<input id="fertRatio" placeholder="希釈（例：1000倍）">
`;
}

if(type==="pest"){
extra.innerHTML=`
<input id="pestType" placeholder="害虫名">
<input id="pestLevel" placeholder="量（少ない・普通・多い）">
`;
}

if(type==="memo"){
extra.innerHTML=`
<input id="memoText" placeholder="メモ">
`;
}

}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function saveEvent(){

const plant =
plants.find(p => p.id === modalState.plantId);

const date =
document.getElementById("eventDate").value;

if(!date) return;

let text="";

switch(modalState.type){

case "germ":
text="🌱 発芽";
break;

case "fert":
text=`💧 ${document.getElementById("fertType").value}（${document.getElementById("fertRatio").value}）`;
break;

case "pest":
text=`🐛 ${document.getElementById("pestType").value}（${document.getElementById("pestLevel").value}）`;
break;

case "rohaphi":
text="💊 ロハピ";
break;

case "harvest":
text="🍅 収穫";
break;

case "memo":
text=`📝 ${document.getElementById("memoText").value}`;
break;

}

plant.events.push({
id:crypto.randomUUID(),
date,
text
});

/* 保存時に時系列ソート */
plant.events.sort(
(a,b)=>new Date(a.date)-new Date(b.date)
);

save();
closeModal();
}

function deletePlant(id){
if(!confirm("削除しますか？")) return;

plants = plants.filter(p=>p.id!==id);

save();
}

function deleteEvent(pid,eid){

const plant=
plants.find(p=>p.id===pid);

plant.events=
plant.events.filter(e=>e.id!==eid);

save();
}

function checkNotifications(){

if(Notification.permission !== "granted") return;

plants.forEach(plant=>{

plant.events.forEach(e=>{

if(!e.text.startsWith("💧")) return;

const diff=days(e.date);

if(diff===7 && !notified[e.id]){

new Notification("🌱 とまログ",{
body:`${plant.name}：液肥から7日経ちました`
});

notified[e.id]=true;

localStorage.setItem(
"tomalog_notified",
JSON.stringify(notified)
);

}

});

});

}

function render(){

const list=document.getElementById("list");
list.innerHTML="";

/* 過去データも時系列へ */
plants.forEach(plant=>{
plant.events.sort(
(a,b)=>new Date(a.date)-new Date(b.date)
);
});

plants.forEach(plant=>{

let germ=
plant.events.find(
e=>e.text.includes("発芽")
);

let fertEvents=
plant.events
.filter(e=>e.text.startsWith("💧"))
.sort(
(a,b)=>new Date(b.date)-new Date(a.date)
);

let fert=fertEvents[0] || null;

let germText=
germ
? `発芽から ${days(germ.date)}日`
: "発芽待ち";

let fertDays=
fert ? days(fert.date) : null;
