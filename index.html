<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
box-shadow:0 1px 2px rgba(0,0,0,0.1);
}

button:active{
transform:scale(0.98);
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
font-size:14px;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<script>

let plants =
JSON.parse(localStorage.getItem("tomalog") || "[]");

/* 保存＆描画 */
function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

/* 日数 */
function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* 🌱 追加 */
function addPlant(){

const name = document.getElementById("name").value;
const date = document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id: crypto.randomUUID(),
name,
sow: date,
events:[
{
id: crypto.randomUUID(),
date,
text:"種まき"
}
]
});

save();
}

/* ⚡ 基本イベント */
function addEvent(plantId,type){

const plant = plants.find(p => p.id === plantId);

const date = prompt("日付（例：2026-06-12）", new Date().toISOString().slice(0,10));
if(!date) return;

let text="";

switch(type){

case "germ":
text="🌱 発芽";
break;

case "harvest":
text="🍅 収穫";
break;

case "rohaphi":
text="💊 ロハピ";
break;

case "memo":
text=prompt("メモ入力");
if(!text) return;
break;

}

plant.events.push({
id:crypto.randomUUID(),
date,
text
});

save();
}

/* 💧 液肥（安定版） */
function addFert(plantId){

const plant = plants.find(p => p.id === plantId);

const date = prompt("日付（例：2026-06-12）", new Date().toISOString().slice(0,10));
if(!date) return;

const type = prompt("液肥の種類（例：ハイポネックス）");
if(!type) return;

const ratio = prompt("希釈（例：1000倍）");
if(!ratio) return;

plant.events.push({
id:crypto.randomUUID(),
date,
text:`💧 ${type}（${ratio}）`
});

save();
}

/* 🐛 害虫（安定版） */
function addPest(plantId){

const plant = plants.find(p => p.id === plantId);

const date = prompt("日付（例：2026-06-12）", new Date().toISOString().slice(0,10));
if(!date) return;

const type = prompt("害虫（例：アブラムシ）");
if(!type) return;

const level = prompt("量（少ない・普通・多い）");
if(!level) return;

plant.events.push({
id:crypto.randomUUID(),
date,
text:`🐛 ${type}（${level}）`
});

save();
}

/* 🗑 削除 */
function deletePlant(id){
if(!confirm("削除しますか？"))return;
plants=plants.filter(p=>p.id!==id);
save();
}

function deleteEvent(pid,eid){
const plant=plants.find(p=>p.id===pid);
plant.events=plant.events.filter(e=>e.id!==eid);
save();
}

/* 🖥 表示 */
function render(){

const list=document.getElementById("list");
list.innerHTML="";

plants.forEach(plant=>{

let germ=plant.events.find(e=>e.text.includes("発芽"));
let fert=plant.events.find(e=>e.text.includes("液肥"));

let germText=germ?`発芽から ${days(germ.date)}日`:"発芽待ち";
let fertText=fert?`液肥から ${days(fert.date)}日`:"液肥なし";

let events=plant.events.slice().reverse().map(e=>
`<li class="event-item">
<span>${e.date} ${e.text}</span>
<button class="delete-btn" onclick="deleteEvent('${plant.id}','${e.id}')">×</button>
</li>`
).join("");

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>🌱 ${plant.name}</b>

<div class="small">種まきから ${days(plant.sow)}日</div>
<div class="small">${germText}</div>
<div class="small">${fertText}</div>

<div class="quick-buttons">
<button onclick="addEvent('${plant.id}','germ')">🌱 発芽</button>
<button onclick="addFert('${plant.id}')">💧 液肥</button>
<button onclick="addPest('${plant.id}')">🐛 害虫</button>
<button onclick="addEvent('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="addEvent('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="addEvent('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="deletePlant('${plant.id}')">この野菜を削除</button>

<ul>${events}</ul>
`;

list.appendChild(div);

});

}

render();

</script>

</body>
</html>
