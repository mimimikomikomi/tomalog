

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}

/* モーダル */
.modal{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.4);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-content{
background:white;
padding:15px;
border-radius:10px;
width:100%;
max-width:320px;
}

/* 🔴 7日超え */
.overdue{
color:#d32f2f;
font-weight:bold;
}

/* 進捗バー */
.progress{
height:8px;
background:#e0e0e0;
border-radius:999px;
margin-top:6px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#66bb6a;
}

</style>
</head>

<body>

<h1>🍅 とまログ</h1>



<div class="card" id="weatherCard">
  ☁️ 天気取得中...
</div>
  
<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<!-- モーダル -->
<div class="modal" id="modal">
<div class="modal-content">

<h3 id="modalTitle"></h3>

<input type="date" id="eventDate">

<div id="extraFields"></div>

<button onclick="saveEvent()">保存</button>
<button onclick="closeModal()">キャンセル</button>

</div>
</div>

<script>

/* ===== データ ===== */
let plants = JSON.parse(localStorage.getItem("tomalog") || "[]");
let notified = JSON.parse(localStorage.getItem("tomalog_notified") || "{}");

let modalState = { plantId:null, type:null };

let openPlants = JSON.parse(
  localStorage.getItem("tomalog_open") || "{}"
);
  
/* ===== 通知許可 ===== */
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

/* ===== 保存 ===== */
function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

/* ===== 開閉状態保存 ===== */
function saveOpenState(){
  localStorage.setItem(
    "tomalog_open",
    JSON.stringify(openPlants)
  );
}

function togglePlant(id){
  openPlants[id] = !openPlants[id];
  saveOpenState();
  render();
}

/* ===== 日数 ===== */
function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* ===== 収穫目安 ===== */

function getHarvestDays(name){

  if(name.includes("トマト") || name.includes("とまと"))

    return 80;

  if(name.includes("オクラ"))

    return 60;

  if(name.includes("枝豆"))

    return 75;

  if(name.includes("大葉"))

    return 45;

  if(name.includes("きゅうり"))

    return 55;

  if(name.includes("二十日大根"))

    return 30;

  return null;

}

/* ===== 追加 ===== */
function addPlant(){

const name=document.getElementById("name").value;
const date=document.getElementById("date").value;

if(!name||!date){
alert("入力してください");
return;
}

plants.push({
id:crypto.randomUUID(),
name,
sow:date,
events:[{
id:crypto.randomUUID(),
date,
text:"種まき"
}]
});

save();
}

/* ===== モーダル ===== */
function openModal(plantId,type){

modalState={plantId,type};

document.getElementById("modal").style.display="flex";

const titleMap={
germ:"🌱 発芽",
fert:"💧 液肥",
pest:"🐛 害虫",
rohaphi:"💊 ロハピ",
harvest:"🍅 収穫",
memo:"📝 メモ"
};

document.getElementById("modalTitle").innerText=titleMap[type];

document.getElementById("eventDate").value=new Date().toISOString().slice(0,10);

const extra=document.getElementById("extraFields");
extra.innerHTML="";

if(type==="fert"){
extra.innerHTML=`
<input id="fertType" placeholder="液肥の種類">
<input id="fertRatio" placeholder="希釈（例：1000倍）">
`;
}

if(type==="pest"){
extra.innerHTML=`
<input id="pestType" placeholder="害虫名">
<input id="pestLevel" placeholder="量（少ない・普通・多い）">
`;
}

if(type==="memo"){
extra.innerHTML=`
<input id="memoText" placeholder="メモ">
`;
}
if(type==="harvest"){
extra.innerHTML=`
<input id="harvestCount"
type="number"
min="1"
placeholder="収穫数（個）">
`;
}
}

/* ===== 閉じる ===== */
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* ===== 保存 ===== */
function saveEvent(){

const plant = plants.find(p => p.id === modalState.plantId);
const date = document.getElementById("eventDate").value;

if(!date) return;

let text="";

switch(modalState.type){

case "germ":
text="🌱 発芽";
break;

case "fert":
text=`💧 ${document.getElementById("fertType").value}（${document.getElementById("fertRatio").value}）`;
break;

case "pest":
text=`🐛 ${document.getElementById("pestType").value}（${document.getElementById("pestLevel").value}）`;
break;

case "rohaphi":
text="💊 ロハピ";
break;

case "harvest":

const count =
document.getElementById("harvestCount").value || 0;

text=`🍅 収穫 ${count}個`;

break;

case "memo":
text=`📝 ${document.getElementById("memoText").value}`;
break;

}

plant.events.push({
id:crypto.randomUUID(),
date,
text
});

save();
closeModal();
}

/* ===== 削除 ===== */
function deletePlant(id){
if(!confirm("削除しますか？"))return;
plants=plants.filter(p=>p.id!==id);
save();
}

function deleteEvent(pid,eid){
const plant=plants.find(p=>p.id===pid);
plant.events=plant.events.filter(e=>e.id!==eid);
save();
}

/* ===== 通知（液肥7日） ===== */
function checkNotifications(){

if(Notification.permission !== "granted") return;

const now = new Date();

plants
.slice()
.sort((a,b)=>new Date(a.sow)-new Date(b.sow))
.forEach(plant=>{

plant.events.forEach(e=>{

if(!e.text.startsWith("💧")) return;

const diff = days(e.date);

if(diff === 7 && !notified[e.id]){

new Notification("🌱 とまログ", {
body:`${plant.name}：液肥から7日経ちました`
});

notified[e.id] = true;
localStorage.setItem("tomalog_notified", JSON.stringify(notified));
}

});

});

}

/* ===== 表示 ===== */
function render(){

const list=document.getElementById("list");
list.innerHTML="";

plants

.slice()

.sort((a,b)=>new Date(a.sow)-new Date(b.sow))

.forEach(plant=>{

let progress = 0;

let totalHarvest = plant.events
.filter(e => e.text.startsWith("🍅 収穫"))
.reduce((sum, e) => {

  const match = e.text.match(/(\d+)個/);

  return sum + (match ? Number(match[1]) : 0);

}, 0);
  
let germ = plant.events.find(
  e => e.text.includes("発芽")
);

let forecastText = "";

const harvestDays =
  getHarvestDays(plant.name);

if(harvestDays){

  const baseDate =
    germ ? germ.date : plant.sow;

  progress = Math.min(
    100,
    Math.round(
      days(baseDate) /
      harvestDays * 100
    )
  );

  const forecastDate =
    new Date(baseDate);

  forecastDate.setDate(
    forecastDate.getDate() + harvestDays
  );

  const remain = Math.ceil(
    (forecastDate - new Date())
    / 86400000
  );

  const m = forecastDate.getMonth()+1;
  const d = forecastDate.getDate();

  forecastText =
    remain > 0
      ? `🗓 ${m}/${d} あと${remain}日`
      : `🗓 ${m}/${d} 収穫時期`;
}

  

  
let fertEvents = plant.events.filter(e => e.text.startsWith("💧"));
let fert = fertEvents.length ? fertEvents[fertEvents.length - 1] : null;

let germText = germ ? `発芽から ${days(germ.date)}日` : "発芽待ち";

let fertDays = fert ? days(fert.date) : null;

let fertText = fert
? `<span class="${fertDays >= 7 ? 'overdue' : ''}">
液肥から ${fertDays}日
</span>`
: "液肥なし";

let events = plant.events
.slice()
.sort((a,b)=>new Date(a.date)-new Date(b.date))
.map(e=>{

const d = new Date(e.date);

const dateText =
  `${d.getMonth()+1}/${d.getDate()}`;

return `
<li class="event-item">
<span>${dateText} ${e.text}</span>
<button class="delete-btn"
onclick="deleteEvent('${plant.id}','${e.id}')">
×
</button>
</li>
`;

})
.join("");

  const isOpen = openPlants[plant.id] ?? false;
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div
onclick="togglePlant('${plant.id}')"
style="
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
font-weight:bold;
padding:8px 0;
"
>
<span>
${isOpen ? "▼" : "▶"} ${plant.name}
</span>

<span style="
font-size:14px;
color:#666;
white-space:nowrap;
">
🌱${days(plant.sow)}日
🍅${totalHarvest}個
</span>
</div>

<div class="progress">
<div
class="progress-bar"
style="width:${progress}%">
</div>

</div>

${isOpen ? `
<div class="small">${germText}</div>
<div class="small">${fertText}</div>
<div class="small">${forecastText}</div>

<div class="quick-buttons">
${!germ ? `
<button onclick="event.stopPropagation();openModal('${plant.id}','germ')">
🌱 発芽
</button>
` : ""}
<button onclick="event.stopPropagation();openModal('${plant.id}','fert')">💧 液肥</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','pest')">🐛 害虫</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="event.stopPropagation();openModal('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="event.stopPropagation();deletePlant('${plant.id}')">
この野菜を削除
</button>

<ul>${events}</ul>
` : ""}
`;

list.appendChild(div);

});

checkNotifications();

}

/* ===== 定期チェック ===== */
setInterval(checkNotifications, 60 * 60 * 1000);

/* ===== 長野市の天気 ===== */
async function loadWeather(){

  try{

    // 長野市
    const lat = 36.6486;
    const lon = 138.1942;

    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`
    );

    const data = await res.json();

    const temp =
  Math.round(data.current.temperature_2m);

const code =
  data.current.weather_code;

/* ← ここに追加 */
let advice = "";

if([51,53,55,61,63,65,80,81,82].includes(code)){
  advice = "🐌 雨の日はナメクジ注意";
}
else if(code === 0){
  advice = "☀️ 水切れに注意";
}
else if(temp >= 30){
  advice = "🥵 高温注意・朝夕に水やり";
}
else if([95,96,99].includes(code)){
  advice = "⛈️ 強風で支柱確認";
}

    let weather = "☁️";

    if(code === 0) weather = "☀️";
    else if([1,2,3].includes(code)) weather = "🌤️";
    else if([45,48].includes(code)) weather = "🌫️";
    else if(
      [51,53,55,61,63,65,80,81,82]
      .includes(code)
    ) weather = "🌧️";
    else if(
      [71,73,75,77,85,86]
      .includes(code)
    ) weather = "❄️";
    else if(
      [95,96,99].includes(code)
    ) weather = "⛈️";

    document.getElementById("weatherCard").innerHTML =
`
<div style="font-size:20px">
${weather} 長野市 ${temp}℃
</div>

<div class="small">
${advice}
</div>
`;

  }catch(e){

    document.getElementById(
      "weatherCard"
    ).innerHTML =
      "⚠️ 天気取得失敗";

  }
}
  
loadWeather();
render();

</script>

</body>
</html>
