<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

/* 🟢 入力カード */
.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

/* 🟢 全体ボタン（薄い緑に変更） */
button{
background:#dcedc8;   /* ←薄い緑 */
color:#2e7d32;        /* ←濃い文字で見やすく */
border:none;
border-radius:8px;
padding:10px;
margin:5px 0;
box-sizing:border-box;
box-shadow:0 1px 2px rgba(0,0,0,0.1);
}

button:active{
transform:scale(0.98);
}

/* 小さい説明 */
.small{
color:#666;
font-size:14px;
}

/* イベント1行 */
.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

/* ×ボタン（シンプル） */
.delete-btn{
background:none;
border:none;
color:#999;
font-size:14px;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.delete-btn:hover{
color:#333;
}

/* ワンタップボタン群 */
.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<script>

let plants =
JSON.parse(localStorage.getItem("tomalog") || "[]");

function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* 🌱 野菜追加 */
function addPlant(){

const name = document.getElementById("name").value;
const date = document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id: crypto.randomUUID(),
name: name,
sow: date,
germ: null,
events: [
{
id: crypto.randomUUID(),
date: date,
text: "🌱 種まき"
}
]
});

save();
}

/* ⚡ ワンタップイベント */
function addQuickEvent(plantId, type){

const plant = plants.find(p => p.id === plantId);

const date = new Date().toISOString().slice(0,10);

let text = "";

switch(type){

case "germ":
text = "🌱 発芽";
if(!plant.germ) plant.germ = date;
break;

case "fert":
text = "💧 液肥";
break;

case "pest":
text = "🐛 害虫";
break;

case "rohaphi":
text = "💊 ロハピ";
break;

case "harvest":
text = "🍅 収穫";
break;

case "memo":
text = prompt("メモを入力");
if(!text) return;
break;

}

plant.events.push({
id: crypto.randomUUID(),
date: date,
text: text
});

save();
}

/* 🗑 野菜削除 */
function deletePlant(id){

if(!confirm("この野菜を削除しますか？")) return;

plants = plants.filter(p => p.id !== id);

save();
}

/* 🗑 イベント削除（1行単位） */
function deleteEvent(plantId, eventId){

const plant = plants.find(p => p.id === plantId);

plant.events = plant.events.filter(e => e.id !== eventId);

save();
}

/* 🖥 表示 */
function render(){

const list = document.getElementById("list");
list.innerHTML = "";

plants.forEach(plant => {

let germText = "発芽待ち";
if(plant.germ){
germText = "発芽から " + days(plant.germ) + "日";
}

/* 💧 液肥 */
let fertDate = null;

plant.events.forEach(e => {
if(e.text.includes("液肥")){
fertDate = e.date;
}
});

let fertText = "液肥なし";
if(fertDate){
fertText = "液肥から " + days(fertDate) + "日";
}

/* 📋 イベント */
let events = plant.events
.slice()
.reverse()
.map(e =>
`<li class="event-item">
<span>${e.date} ${e.text}</span>
<button class="delete-btn"
onclick="deleteEvent('${plant.id}','${e.id}')">×</button>
</li>`
)
.join("");

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>🌱 ${plant.name}</b>

<div class="small">種まきから ${days(plant.sow)}日</div>
<div class="small">${germText}</div>
<div class="small">${fertText}</div>

<div class="quick-buttons">
<button onclick="addQuickEvent('${plant.id}','germ')">🌱 発芽</button>
<button onclick="addQuickEvent('${plant.id}','fert')">💧 液肥</button>
<button onclick="addQuickEvent('${plant.id}','pest')">🐛 害虫</button>
<button onclick="addQuickEvent('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="addQuickEvent('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="addQuickEvent('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="deletePlant('${plant.id}')">
この野菜を削除
</button>

<ul>
${events}
</ul>
`;

list.appendChild(div);

});

}

render();

</script>

</body>
</html>
