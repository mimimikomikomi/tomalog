<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}

/* モーダル */
.modal{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.4);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-content{
background:white;
padding:15px;
border-radius:10px;
width:100%;
max-width:320px;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<!-- モーダル -->
<div class="modal" id="modal">
<div class="modal-content">

<h3 id="modalTitle"></h3>

<input type="date" id="eventDate">

<div id="extraFields"></div>

<button onclick="saveEvent()">保存</button>
<button onclick="closeModal()">キャンセル</button>

</div>
</div>

<script>

/* ===== データ ===== */
let plants = JSON.parse(localStorage.getItem("tomalog") || "[]");
let notified = JSON.parse(localStorage.getItem("tomalog_notified") || "{}");

let modalState = { plantId:null, type:null };

/* ===== 初期通知許可 ===== */
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

/* ===== 保存 ===== */
function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

/* ===== 日数計算 ===== */
function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* ===== 野菜追加 ===== */
function addPlant(){

const name=document.getElementById("name").value;
const date=document.getElementById("date").value;

if(!name||!date){
alert("入力してください");
return;
}

plants.push({
id:crypto.randomUUID(),
name,
sow:date,
events:[{
id:crypto.randomUUID(),
date,
text:"種まき"
}]
});

save();
}

/* ===== モーダル ===== */
function openModal(plantId,type){

modalState={plantId,type};

document.getElementById("modal").style.display="flex";

const titleMap={
germ:"🌱 発芽",
fert:"💧 液肥",
pest:"🐛 害虫",
rohaphi:"💊 ロハピ",
harvest:"🍅 収穫",
memo:"📝 メモ"
};

document.getElementById("modalTitle").innerText=titleMap[type];

document.getElementById("eventDate").value=new Date().toISOString().slice(0,10);

const extra=document.getElementById("extraFields");
extra.innerHTML="";

if(type==="fert"){
extra.innerHTML=`
<input id="fertType" placeholder="液肥の種類">
<input id="fertRatio" placeholder="希釈（例：1000倍）">
`;
}

if(type==="pest"){
extra.innerHTML=`
<input id="pestType" placeholder="害虫名">
<input id="pestLevel" placeholder="量（少ない・普通・多い）">
`;
}

if(type==="memo"){
extra.innerHTML=`
<input id="memoText" placeholder="メモ">
`;
}

}

/* ===== 閉じる ===== */
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* ===== 保存 ===== */
function saveEvent(){

const plant=plants.find(p=>p.id===modalState.plantId);
const date=document.getElementById("eventDate").value;

if(!date) return;

let text="";

switch(modalState.type){

case "germ":
text="🌱 発芽";
break;

case "fert":
text=`💧 ${fertType.value}（${fertRatio.value}）`;
break;

case "pest":
text=`🐛 ${pestType.value}（${pestLevel.value}）`;
break;

case "rohaphi":
text="💊 ロハピ";
break;

case "harvest":
text="🍅 収穫";
break;

case "memo":
text=`📝 ${memoText.value}`;
break;

}

plant.events.push({
id:crypto.randomUUID(),
date,
text
});

save();
closeModal();
}

/* ===== 削除 ===== */
function deletePlant(id){
if(!confirm("削除しますか？"))return;
plants=plants.filter(p=>p.id!==id);
save();
}

function deleteEvent(pid,eid){
const plant=plants.find(p=>p.id===pid);
plant.events=plant.events.filter(e=>e.id!==eid);
save();
}

/* ===== 通知チェック（液肥7日） ===== */
function checkNotifications(){

if(Notification.permission !== "granted") return;

const now = new Date();

plants.forEach(plant=>{

plant.events.forEach(e=>{

if(!e.text.includes("液肥")) return;

const diff = Math.floor((now - new Date(e.date)) / 86400000);

if(diff === 7){

if(notified[e.id]) return;

new Notification("🌱 とまログ", {
body:`${plant.name}：液肥から7日経ちました`
});

notified[e.id] = true;
localStorage.setItem("tomalog_notified", JSON.stringify(notified));
}

});

});

}

/* ===== 表示 ===== */
function render(){

const list=document.getElementById("list");
list.innerHTML="";

plants.forEach(plant=>{

let germ=plant.events.find(e=>e.text.includes("発芽"));
let fert=plant.events.find(e=>e.text.includes("液肥"));

let germText=germ?`発芽から ${days(germ.date)}日`:"発芽待ち";
let fertText=fert?`液肥から ${days(fert.date)}日`:"液肥なし";

let events=plant.events.slice().reverse().map(e=>
`<li class="event-item">
<span>${e.date} ${e.text}</span>
<button class="delete-btn" onclick="deleteEvent('${plant.id}','${e.id}')">×</button>
</li>`
).join("");

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>🌱 ${plant.name}</b>

<div class="small">種まきから ${days(plant.sow)}日</div>
<div class="small">${germText}</div>
<div class="small">${fertText}</div>

<div class="quick-buttons">
<button onclick="openModal('${plant.id}','germ')">🌱 発芽</button>
<button onclick="openModal('${plant.id}','fert')">💧 液肥</button>
<button onclick="openModal('${plant.id}','pest')">🐛 害虫</button>
<button onclick="openModal('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="openModal('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="openModal('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="deletePlant('${plant.id}')">この野菜を削除</button>

<ul>${events}</ul>
`;

list.appendChild(div);

});

checkNotifications();

}

/* ===== 自動チェック（1時間ごと） ===== */
setInterval(checkNotifications, 60 * 60 * 1000);

render();

</script>

</body>
</html>
