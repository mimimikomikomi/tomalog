<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
box-shadow:0 1px 2px rgba(0,0,0,0.1);
}

button:active{
transform:scale(0.98);
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
font-size:14px;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<script>

let plants =
JSON.parse(localStorage.getItem("tomalog") || "[]");

/* 💾 保存（必ず再描画） */
function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

/* 📅 日数計算 */
function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* 🌱 野菜追加 */
function addPlant(){

const name = document.getElementById("name").value;
const date = document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id: crypto.randomUUID(),
name,
sow: date,
events:[
{
id: crypto.randomUUID(),
date: date,
text:"種まき"
}
]
});

save();
}

/* ⚡ イベント追加（正解構造） */
function addEvent(plantId, type){

const plant = plants.find(p => p.id === plantId);

/* 👉 ここがルール：必ず日付を入力 */
const date = prompt(
"日付を入力（例：2026-06-12）",
new Date().toISOString().slice(0,10)
);

if(!date) return;

let text = "";

switch(type){

case "germ":
text = "🌱 発芽";
break;

case "fert":
text = "💧 液肥";
break;

case "harvest":
text = "🍅 収穫";
break;

case "rohaphi":
text = "💊 ロハピ";
break;

case "memo":
text = prompt("メモを入力");
if(!text) return;
break;

case "pest":

const pests = ["アブラムシ","青虫","ハダニ","その他"];
const levels = ["少ない","普通","多い"];

const p = prompt("害虫\n" + pests.join(" / "));
if(!p) return;

const l = prompt("量\n" + levels.join(" / "));
if(!l) return;

text = `🐛 ${p}（${l}）`;
break;

}

/* 👉 正解：必ず date + text */
plant.events.push({
id: crypto.randomUUID(),
date,
text
});

save();
}

/* 🗑 野菜削除 */
function deletePlant(id){

if(!confirm("削除しますか？")) return;

plants = plants.filter(p => p.id !== id);

save();
}

/* 🗑 イベント削除 */
function deleteEvent(pid,eid){

const plant = plants.find(p => p.id === pid);

plant.events = plant.events.filter(e => e.id !== eid);

save();
}

/* 🖥 表示（正解構造） */
function render(){

const list = document.getElementById("list");
list.innerHTML = "";

plants.forEach(plant => {

/* 発芽・液肥はeventsから取得 */
let germ = plant.events.find(e => e.text.includes("発芽"));
let fert = plant.events.find(e => e.text.includes("液肥"));

let germText = germ ? `発芽から ${days(germ.date)}日` : "発芽待ち";
let fertText = fert ? `液肥から ${days(fert.date)}日` : "液肥なし";

/* イベント一覧（正解：必ず date 表示） */
let events = plant.events
.slice()
.reverse()
.map(e =>
`<li class="event-item">
<span>${e.date} ${e.text}</span>
<button class="delete-btn"
onclick="deleteEvent('${plant.id}','${e.id}')">×</button>
</li>`
).join("");

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>🌱 ${plant.name}</b>

<div class="small">種まきから ${days(plant.sow)}日</div>
<div class="small">${germText}</div>
<div class="small">${fertText}</div>

<div class="quick-buttons">
<button onclick="addEvent('${plant.id}','germ')">🌱 発芽</button>
<button onclick="addEvent('${plant.id}','fert')">💧 液肥</button>
<button onclick="addEvent('${plant.id}','pest')">🐛 害虫</button>
<button onclick="addEvent('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="addEvent('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="addEvent('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="deletePlant('${plant.id}')">この野菜を削除</button>

<ul>${events}</ul>
`;

list.appendChild(div);

});

}

render();

</script>

</body>
</html>
