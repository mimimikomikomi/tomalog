<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#dcedc8;
color:#2e7d32;
border:none;
border-radius:8px;
box-shadow:0 1px 2px rgba(0,0,0,0.1);
}

button:active{
transform:scale(0.98);
}

.small{
color:#666;
font-size:14px;
}

.event-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:2px 0;
}

.delete-btn{
background:none;
border:none;
color:#999;
font-size:14px;
width:auto;
padding:2px 6px;
cursor:pointer;
}

.delete-btn:hover{
color:#333;
}

.quick-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:8px 0;
}

.quick-buttons button{
flex:1;
min-width:90px;
font-size:12px;
padding:8px;
}

/* 🐛 モーダル */
#pestModal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.4);
}

#pestModalContent{
background:white;
margin:20% auto;
padding:16px;
border-radius:10px;
width:90%;
max-width:320px;
text-align:center;
}

#pestModal button{
margin:4px;
width:auto;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<!-- 🐛 害虫モーダル -->
<div id="pestModal">
<div id="pestModalContent">

<h3>🐛 害虫を選択</h3>

<div id="pestType"></div>
<div id="pestLevel"></div>

<button onclick="closePest()">キャンセル</button>

</div>
</div>

<script>

let plants =
JSON.parse(localStorage.getItem("tomalog") || "[]");

function save(){
localStorage.setItem("tomalog", JSON.stringify(plants));
render();
}

function days(date){
return Math.floor((Date.now() - new Date(date)) / 86400000);
}

/* 🌱 追加 */
function addPlant(){

const name = document.getElementById("name").value;
const date = document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id: crypto.randomUUID(),
name,
sow: date,
events:[
{
id: crypto.randomUUID(),
date,
text:"種まき"
}
]
});

save();
}

/* ⚡ イベント追加 */
function addQuickEvent(plantId, type){

const plant = plants.find(p => p.id === plantId);

const date = new Date().toISOString().slice(0,10);

let text = "";

switch(type){

case "germ":
text = "🌱 発芽";
break;

case "fert":
text = "💧 液肥";
break;

case "harvest":
text = "🍅 収穫";
break;

case "rohaphi":
text = "💊 ロハピ";
break;

case "memo":
text = prompt("メモを入力");
if(!text) return;
break;

}

plant.events.push({
id: crypto.randomUUID(),
date,
text
});

save();
}

/* 🐛 モーダル制御 */
let currentPlantId = null;
let selectedType = null;
let selectedLevel = null;

function openPest(plantId){

currentPlantId = plantId;
selectedType = null;
selectedLevel = null;

document.getElementById("pestModal").style.display = "block";

/* 種類 */
const types = ["アブラムシ","青虫","ハダニ","その他"];
document.getElementById("pestType").innerHTML =
types.map(t =>
`<button onclick="selectType('${t}')">${t}</button>`
).join("");

/* 量 */
const levels = ["少ない","普通","多い"];
document.getElementById("pestLevel").innerHTML =
levels.map(l =>
`<button onclick="selectLevel('${l}')">${l}</button>`
).join("");
}

function selectType(t){
selectedType = t;
checkPest();
}

function selectLevel(l){
selectedLevel = l;
checkPest();
}

function checkPest(){

if(!selectedType || !selectedLevel) return;

const plant = plants.find(p => p.id === currentPlantId);

const date = new Date().toISOString().slice(0,10);

plant.events.push({
id: crypto.randomUUID(),
date,
text:`🐛 ${selectedType}（${selectedLevel}）`
});

closePest();
save();
}

function closePest(){
document.getElementById("pestModal").style.display = "none";
}

/* 🗑 削除 */
function deletePlant(id){

if(!confirm("削除しますか？")) return;

plants = plants.filter(p => p.id !== id);

save();
}

function deleteEvent(pid,eid){

const plant = plants.find(p => p.id === pid);

plant.events = plant.events.filter(e => e.id !== eid);

save();
}

/* 🖥 表示 */
function render(){

const list = document.getElementById("list");
list.innerHTML = "";

plants.forEach(plant => {

let germ = plant.events.find(e => e.text.includes("発芽"));
let fert = plant.events.find(e => e.text.includes("液肥"));

let germText = germ ? `発芽から ${days(germ.date)}日` : "発芽待ち";
let fertText = fert ? `液肥から ${days(fert.date)}日` : "液肥なし";

let events = plant.events
.slice()
.reverse()
.map(e =>
`<li class="event-item">
<span>${e.date} ${e.text}</span>
<button class="delete-btn"
onclick="deleteEvent('${plant.id}','${e.id}')">×</button>
</li>`
).join("");

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>🌱 ${plant.name}</b>

<div class="small">種まきから ${days(plant.sow)}日</div>
<div class="small">${germText}</div>
<div class="small">${fertText}</div>

<div class="quick-buttons">
<button onclick="addQuickEvent('${plant.id}','germ')">🌱 発芽</button>
<button onclick="addQuickEvent('${plant.id}','fert')">💧 液肥</button>
<button onclick="openPest('${plant.id}')">🐛 害虫</button>
<button onclick="addQuickEvent('${plant.id}','rohaphi')">💊 ロハピ</button>
<button onclick="addQuickEvent('${plant.id}','harvest')">🍅 収穫</button>
<button onclick="addQuickEvent('${plant.id}','memo')">📝 メモ</button>
</div>

<button onclick="deletePlant('${plant.id}')">
この野菜を削除
</button>

<ul>${events}</ul>
`;

list.appendChild(div);

});

}

render();

</script>

</body>
</html>
