<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 とまログ</title>

<style>
body{
font-family:-apple-system,sans-serif;
background:#f5f7f5;
margin:0;
padding:12px;
}

h1{
background:#2f8f46;
color:white;
padding:14px;
border-radius:10px;
}

.card{
background:white;
padding:12px;
border-radius:10px;
margin:10px 0;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#2f8f46;
color:white;
border:none;
border-radius:8px;
}

.small{
color:#666;
font-size:14px;
}

li{
margin:4px 0;
}
</style>
</head>

<body>

<h1>🍅 とまログ</h1>

<div class="card">
<input id="name" placeholder="野菜名">
<input id="date" type="date">
<button onclick="addPlant()">登録</button>
</div>

<div id="list"></div>

<script>

let plants =
JSON.parse(localStorage.getItem("tomalog") || "[]");

function save(){
localStorage.setItem(
"tomalog",
JSON.stringify(plants)
);
render();
}

function days(date){
return Math.floor(
(Date.now() - new Date(date)) / 86400000
);
}

function addPlant(){

const name =
document.getElementById("name").value;

const date =
document.getElementById("date").value;

if(!name || !date){
alert("入力してください");
return;
}

plants.push({
id: Date.now(),
name: name,
sow: date,
germ: null,
events: [
{
id: Date.now(),
date: date,
text: "🌱 種まき"
}
]
});

save();
}

function addEvent(id){

const text = prompt(
"発芽、液肥、害虫、ロハピ、収穫、メモ"
);

if(!text) return;

const plant =
plants.find(p => p.id === id);

const date =
prompt(
"日付を入力（例：2026-06-12）",
new Date().toISOString().slice(0,10)
);

if(!date){
alert("日付を入力してください");
return;
}

plant.events.push({
id: Date.now(),
date: date,
text: text
});

if(text.includes("発芽") && !plant.germ){
plant.germ = date;
}

save();
}

function deletePlant(id){

if(!confirm("この野菜を削除しますか？")) return;

plants = plants.filter(p => p.id !== id);

save();
}

function deleteEvent(plantId,eventId){

const plant = plants.find(p => p.id === plantId);

plant.events =
plant.events.filter(e => e.id !== eventId);

save();
}

function render(){

const list =
document.getElementById("list");

list.innerHTML = "";

plants.forEach(plant => {

let germText = "発芽待ち";

if(plant.germ){
germText =
"発芽から " + days(plant.germ) + "日";
}

/* 液肥チェック */
let fertDate = null;

plant.events.forEach(e => {
if(e.text.includes("液肥")){
fertDate = e.date;
}
});

let fertText = "液肥なし";

if(fertDate){
fertText =
"液肥から " + days(fertDate) + "日";
}

/* イベント表示 */
let events =
plant.events
.slice()
.reverse()
.map(e =>
`<li>
${e.date} ${e.text}
<button onclick="deleteEvent(${plant.id},${e.id})">×</button>
</li>`
)
.join("");

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>🌱 ${plant.name}</b>
<div class="small">
種まきから ${days(plant.sow)}日
</div>
<div class="small">
${germText}
</div>
<div class="small">
${fertText}
</div>
<br>

<button onclick="addEvent(${plant.id})">
イベント追加
</button>

<button onclick="deletePlant(${plant.id})">
この野菜を削除
</button>

<ul>
${events}
</ul>
`;

list.appendChild(div);

});

}

render();

</script>

</body>
</html>
